# The darbit workspace: one repo for the Python package, the web UI and the VS Code extension
# (docs/decisions/0002-monorepo.md). `uv sync` here sets up everything for development.
# The package itself is packages/darbit/pyproject.toml.

[tool.uv.workspace]
members = ["packages/darbit"]

[tool.uv.sources]
darbit = { workspace = true }

[dependency-groups]
dev = [
    "darbit",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "pre-commit>=3.7",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=13",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=1.0.8"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["packages/darbit/tests"]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]  # a thread that crashed fails its test

[tool.ruff]
line-length = 120
src = ["packages/darbit/src"]
