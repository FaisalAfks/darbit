[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darbit"
version = "0.1.0"
description = "Simple GUI automation for Windows, in Python"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# the web UI: local server and desktop windows (docs/tasks/T05, T06)
ui = ["starlette>=0.40", "uvicorn>=0.30", "pywebview>=5.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/darbit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
