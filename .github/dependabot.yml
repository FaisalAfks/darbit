# Keeps GitHub Actions, the Python lock file and the web UI's packages up to date: one grouped PR per ecosystem a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: ["type: chore", "skip-notes"]
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    labels: ["type: chore", "skip-notes"]
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    labels: ["type: chore", "skip-notes"]
    groups:
      ui: { patterns: ["*"] }
