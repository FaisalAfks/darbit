# Keeps GitHub Actions and the Python lock file up to date: one grouped PR per ecosystem a week.
# npm (packages/ui) is added once the UI package is installed and built (docs/tasks/T01-ui-package.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: ["type: chore", "skip-notes"]
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    labels: ["type: chore", "skip-notes"]
    groups:
      python: { patterns: ["*"] }
