name: Bug
description: Something doesn't work as it should
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What darbit did, with the log lines or a screenshot if there are any." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: "The smallest script or steps that show it." }
  - type: input
    id: versions
    attributes: { label: Versions, description: "darbit version, Windows version, display scaling (e.g. 0.2.0, Windows 11, 150%)" }
    validations: { required: true }
