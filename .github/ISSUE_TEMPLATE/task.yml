name: Task
description: A planned piece of work from docs/tasks (or a chore)
labels: ["type: task"]
body:
  - type: input
    id: page
    attributes: { label: Task page, description: "docs/tasks/Txx-....md, if there is one" }
  - type: textarea
    id: what
    attributes: { label: What to do }
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: Done when }
    validations: { required: true }
