# A tag vX.Y.Z on main builds the package and makes the GitHub release with notes from the PR labels.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build  # the web UI, into the package (git-ignored, shipped in the wheel)
      - run: uv build --package darbit --out-dir dist
      - run: gh release create ${{ github.ref_name }} dist/*.whl dist/*.tar.gz --title "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
