name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra studio
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pre-commit run plain-python --all-files
      - run: uv run pre-commit run plain-bot-python --all-files
      - run: uv run pytest

  python-linux:  # the tests off Windows, through tests/fake_system.py, so they stay system-independent
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y libegl1 libxkbcommon0  # what Qt needs to draw the Studio offscreen
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra studio
      - run: uv run pytest

  live-windows:  # darbit on a real Windows desktop: tests/live moves the mouse and types into a window of its own
    runs-on: windows-latest
    env:
      DARBIT_LIVE: "1"
      DARBIT_LIVE_SHOTS: live-shots
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra studio
      - run: uv run pytest packages/darbit/tests/live -v -s
      - name: Highlight again at 150% display scaling (Qt's scale; the machine's own is 100%)
        run: uv run pytest packages/darbit/tests/live -v -s -k highlight
        env:
          QT_SCALE_FACTOR: "1.5"
      - name: the Studio's pictures in the log too, as JPEG in base64 (for reading them where artifacts can't be fetched)
        if: always()
        run: uv run python -c "import base64, cv2, pathlib; [print(f'--- {p.name}', base64.b64encode(cv2.imencode('.jpg', cv2.imread(str(p)), [cv2.IMWRITE_JPEG_QUALITY, 80])[1]).decode()) for p in sorted(pathlib.Path('live-shots').glob('*.png'))]"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-shots
          path: live-shots

  bench:
    runs-on: windows-latest
    env:
      HAS_BENCH_TOKEN: ${{ secrets.BENCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: env.HAS_BENCH_TOKEN == 'true'
        with:
          repository: FaisalAfks/darbit-bench
          token: ${{ secrets.BENCH_TOKEN }}
          path: bench/private
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python bench/run.py --repeat 5 --json bench-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: bench-results.json
