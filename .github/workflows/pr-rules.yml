# The PR rules from AGENTS.md, checked: every PR closes an issue and updates CHANGELOG.md (or is labelled skip-notes).
name: PR rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-rules:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Says which issue it closes
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'; then
            echo "::error::Say which issue this closes in the description: Closes #<issue>"
            exit 1
          fi
      - name: Updates the changelog
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-notes') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr diff ${{ github.event.pull_request.number }} -R ${{ github.repository }} --name-only | grep -qx CHANGELOG.md; then
            echo "::error::Add a line to CHANGELOG.md (Unreleased), or label the PR skip-notes"
            exit 1
          fi
