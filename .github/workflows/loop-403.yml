name: loop-403
on:
  push:
    branches: [fix/403-tiles-scroll]
jobs:
  single:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y libegl1 libxkbcommon0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra studio
      - name: the tiles test 30 times
        run: |
          pass=0; fail=0
          for i in $(seq 1 30); do
            if uv run pytest -q -x packages/darbit/tests/test_studio.py::test_capture_lists_the_targets_on_the_shot_as_tiles_in_its_pill > out.txt 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); tail -40 out.txt; fi
          done
          echo "RESULT shard ${{ matrix.shard }}: $pass passed, $fail failed"
          test $fail -eq 0
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y libegl1 libxkbcommon0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra studio
      - name: the whole Studio test file 10 times
        run: |
          pass=0; fail=0
          for i in $(seq 1 10); do
            if uv run pytest -q packages/darbit/tests/test_studio.py > out.txt 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); grep -E "FAILED|^E " out.txt | head; fi
          done
          echo "RESULT suite ${{ matrix.shard }}: $pass passed, $fail failed"
          test $fail -eq 0
