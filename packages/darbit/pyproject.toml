[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darbit"
version = "1.0.0a11"
description = "Automate any app from what's on its screen, in Python"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",  # no GUI part: darbit draws with Qt, and the ocr extra needs this one
    "mss>=9.0",
    "platformdirs>=4.14.5",
]

[project.optional-dependencies]
studio = ["PySide6-Essentials>=6.9"]  # darbit Studio: darbit app (6.9: QtQuick.Effects RectangularShadow)
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20"]  # reading text (d.read): RapidOCR and its models, decision 0019

[project.scripts]
darbit = "darbit.cli:main"

[project.urls]
Homepage = "https://github.com/FaisalAfks/darbit"
Documentation = "https://github.com/FaisalAfks/darbit/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/darbit"]
