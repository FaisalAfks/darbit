[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darbit"
version = "1.0.0.dev0"
description = "Automate any app from what's on its screen, in Python"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mss>=9.0",
    "platformdirs>=4.2",
]

[project.scripts]
darbit = "darbit.cli:main"

[project.urls]
Homepage = "https://github.com/FaisalAfks/darbit"
Documentation = "https://github.com/FaisalAfks/darbit/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/darbit"]
