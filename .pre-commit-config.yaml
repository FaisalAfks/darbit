# Checks run before each commit: `uv run pre-commit install` once per clone (scripts/setup-dev.ps1 does it).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: plain-python
        name: plain Python (docs/style/code.md)
        language: pygrep
        entry: '(:=|^\s*from __future__ import)'
        types: [python]
        files: ^packages/darbit/src/
      - id: plain-bot-python
        name: plainest Python for bot code (docs/style/code.md)
        language: pygrep
        entry: '(:=|^\s*from __future__ import|@staticmethod|\blambda\b)'
        types: [python]
        files: ^examples/
